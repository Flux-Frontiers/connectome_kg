site_name: ConnectomeKG
site_description: Connectomes as knowledge graphs -- the FlyWire FAFB v783 Drosophila brain as a queryable graph, with 3-D and Looking Glass views.
site_url: https://flux-frontiers.github.io/connectome_kg/
repo_url: https://github.com/Flux-Frontiers/connectome_kg
repo_name: Flux-Frontiers/connectome_kg
edit_uri: edit/main/docs/
# The license note for docs/images/ is for readers of the repository, not a page.
exclude_docs: |
  images/README.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.top
    - content.code.copy
    - content.action.edit

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: sphinx
            show_source: true
            show_root_heading: true
            heading_level: 2
            merge_init_into_class: true

nav:
  - Home: index.md
  - Getting started:
      - Get the data: DOWNLOAD.md
  - Querying:
      - Asking the graph a question: queries.md
      - What is in the graph: graph.md
  - CLI reference:
      - Every connkg command: cli.md
  - Visualization:
      - Rendering in 3-D: rendering.md
  - API reference:
      - Scene composition: api/scene.md
      - Neuropil meshes: api/neuropil_meshes.md
      - Skeletons: api/skeletons.md
      - Skeleton cache: api/skeleton_cache.md
