name: Release

# Builds the wheel and sdist and attaches them to a GitHub Release. There is
# deliberately no PyPI publish job: connectome-kg is not published to PyPI
# until the KGRAG adapter gives it a consumer that needs a versioned
# dependency. Restore a pypa/gh-action-pypi-publish job (with the `pypi`
# environment and id-token: write) when that changes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # needed to create GitHub Releases and upload assets

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: poetry install --only main --no-interaction

      - name: Build wheel and sdist
        run: poetry build

      # Publishing the GitHub Release is what makes Zenodo archive this version
      # and mint its DOI; a bare tag push does not.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" &>/dev/null; then
            echo "Release $TAG already exists -- uploading assets only"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "ConnectomeKG $TAG" \
              --notes-file release-notes.md
          fi
