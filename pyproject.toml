# pyproject.toml -- connectome-kg package configuration (PEP 621)
#
# Connectomes as fleet knowledge graphs.
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Extras are user-facing features; dev tooling is a Poetry group, so it never
# ships in the wheel and cannot be pip-installed.
#
# Quick install (pip)
# -------------------
#   pip install -e "."                  core runtime only
#   pip install -e ".[semantic]"        + embedding model for semantic query
#   pip install -e ".[viz]"             + pyvis/plotly for connkg viz
#   pip install -e ".[viz3d]"           + real-geometry 3-D views and quilts
#
# Quick install (poetry)
# ----------------------
#   poetry install                      core runtime only
#   poetry install --with dev           + pytest, ruff, ty, pre-commit
#   poetry install --with kg            + the dockg/pycodekg CLIs (maintainer tooling)
#   poetry install --with docs          + mkdocs, to build the docs site
#   poetry install --all-extras --with dev,kg,docs   full maintainer environment
#
# Run tests
# ---------
#   pytest
#
# Build a graph from the synthetic fixture
# ----------------------------------------
#   connkg fixture --out /tmp/synth1k --n 1000 --seed 1
#   connkg --dataset synthetic1k build --data-dir /tmp/synth1k --no-index
#   connkg path --from GRN_sugar --to MN9

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "connectomekg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "connectome-kg"
version = "0.5.0"
description = "Connectomes (FlyWire, hemibrain, MaleCNS) as KGModule knowledge graphs"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "kgmodule", "connectome", "flywire", "drosophila"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    # Upper-bounded: mcp 2.0 removed the bundled `mcp.server.fastmcp` module (it
    # became the standalone fastmcp package). mcp_server.py imports FastMCP from
    # mcp, so an unbounded floor would let a clean install break `connkg-mcp` at
    # import time. Lift only alongside a port to fastmcp. Floor 1.3.0: the first
    # release whose FastMCP takes the lifespan= and instructions= mcp_server.py
    # passes.
    "mcp>=1.3.0,<2",
    # Floor is the release this prototype was written against.
    "kgmodule-utils>=0.22.0",
    # 1.26.0: the first numpy that installs on Python 3.12, the requires-python floor.
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
semantic = ["kgmodule-utils[semantic]>=0.22.0"]
# 2-D views of a cell type (connkg viz): src/connectomekg/viz.py, imported only
# inside cli/cmd_viz.py. pyvis is not hand-listed: the network renderer is
# kg_utils.viz.build_graph_html, so this extra asks the SDK for it by name, as
# FLEET_STANDARDS.md requires. plotly draws the partners chart.
viz = [
    "kgmodule-utils[viz]>=0.22.0",
    "plotly>=5.14.0",
]
# Real-geometry 3-D views (connkg quilt / connkg viz3d): src/connectomekg/
# skeletons.py (SWC parsing, NumPy only), scene.py (Qt-free scene composition,
# needs PyVista) and viz3d.py (the Qt viewer). Pulled via
# kgmodule-utils[viz3d-render,viz3d-qt] rather than hand-listing pyvista/PyQt5,
# so the render stack stays pinned where the SDK that uses it pins it (a repo
# that hand-lists it drifts from the SDK extra that actually holds it).
#
# pyvistaqt IS hand-listed, deliberately: checked against 0.21.0's own wheel
# metadata, kgmodule-utils[viz3d-qt] pulls PyQt5 and pyvista but not
# pyvistaqt, so a bare [viz3d-render,viz3d-qt] install leaves the viewer's
# QtInteractor missing. genealogy_kg's viz3d extra carries the same explicit
# line for the same reason.
viz3d = [
    "kgmodule-utils[viz3d-render,viz3d-qt]>=0.22.0",
    "pyvistaqt>=0.11.0",
    # 0.14.1: frame_and_focus(spec=) frames at the display aspect render_quilt
    # captures views at, not whatever the window was sized to.
    "quiltwright>=0.15.0",
]

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/connectome_kg"
Repository = "https://github.com/Flux-Frontiers/connectome_kg"
Documentation = "https://flux-frontiers.github.io/connectome_kg/"
Issues = "https://github.com/Flux-Frontiers/connectome_kg/issues"
Changelog = "https://github.com/Flux-Frontiers/connectome_kg/blob/main/CHANGELOG.md"

[project.scripts]
connkg     = "connectomekg.cli:cli"
connkg-mcp = "connectomekg.mcp_server:main"

# ---------------------------------------------------------------------------
# Dev tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# `optional = true` keeps it out of a bare `poetry install`.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
pre-commit = ">=4.5.1"
# >=9.0.3 is a security floor, not a preference: GHSA-6w46-j5rx-g56g.
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
# Capped below 0.16 to match the rest of the fleet.
ruff = ">=0.15,<0.16"
ty = ">=0.0.44"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
# mkdocs is capped below 2: 2.0 removes the plugin system, and this site
# depends on two plugins (search, mkdocstrings).
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.26", extras = ["python"] }

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# Keep prose docs out of ruff 0.16's Markdown code-block formatting.
exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B023", "BLE001", "PLC0415"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.pycodekg]
# Tests skew architectural metrics (fan-in, public API surface, docstring coverage).
exclude = ["tests"]
include = ["src"]

[tool.dockg]
# fafb_v783/ and data/ hold connectome downloads, not documentation. site/ is
# the gitignored mkdocs build: it would index every page twice. papers/ is a
# corpus of its own, built with `dockg build --repo papers` into
# papers/.dockg/ -- indexing it here too would mix the source papers into the
# repository's own documentation graph.
exclude = ["__pycache__", "dist", "src", "tests", "data", "fafb_v783", "site", "papers"]
