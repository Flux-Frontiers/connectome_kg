# pyproject.toml -- connectome-kg package configuration (PEP 621)
#
# Connectomes as fleet knowledge graphs.
#
# Author: Eric G. Suchanek, PhD
#
# Build system : Poetry 2.x with PEP 621 [project] table
#
# Extras are user-facing features; dev tooling is a Poetry group, so it never
# ships in the wheel and cannot be pip-installed. See FLEET_STANDARDS.md in
# kgrag_priv.
#
# Quick install (pip)
# -------------------
#   pip install -e "."                  core runtime only
#   pip install -e ".[semantic]"        + embedding model for semantic query
#
# Quick install (poetry)
# ----------------------
#   poetry install                      core runtime only
#   poetry install --with dev           + pytest, ruff, ty, pre-commit
#   poetry install --with kg            + the dockg/pycodekg CLIs (maintainer tooling)
#   poetry install --all-extras --with dev,kg   full maintainer environment
#
# Run tests
# ---------
#   pytest
#
# Build a graph from the synthetic fixture
# ----------------------------------------
#   connkg fixture --out /tmp/synth1k --n 1000 --seed 1
#   connkg build --data-dir /tmp/synth1k --dataset-id synthetic1k --no-index
#   connkg path --from GRN_sugar --to MN9

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{ include = "connectomekg", from = "src" }]

# ---------------------------------------------------------------------------
# PEP 621 project metadata
# ---------------------------------------------------------------------------
[project]
name = "connectome-kg"
version = "0.1.0"
description = "Connectomes (FlyWire, hemibrain, MaleCNS) as KGModule knowledge graphs"
readme = "README.md"
license = "Elastic-2.0"
authors = [
    { name = "Eric G. Suchanek, PhD", email = "suchanek@flux-frontiers.com" }
]
keywords = ["knowledge-graph", "kgmodule", "connectome", "flywire", "drosophila"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "click>=8.1.0,<9",
    # Floor is the release this prototype was written against.
    "kgmodule-utils>=0.21.0",
    "numpy>=1.24.0",
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
semantic = ["kgmodule-utils[semantic]>=0.21.0"]

[project.urls]
Homepage   = "https://github.com/Flux-Frontiers/connectome_kg"
Repository = "https://github.com/Flux-Frontiers/connectome_kg"

[project.scripts]
connkg = "connectomekg.cli:cli"

# ---------------------------------------------------------------------------
# Dev tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# `optional = true` keeps it out of a bare `poetry install`.
[tool.poetry.group.dev]
optional = true

[tool.poetry.group.dev.dependencies]
detect-secrets = ">=1.5.0"
pre-commit = ">=4.5.1"
# >=9.0.3 is a security floor, not a preference: GHSA-6w46-j5rx-g56g.
pytest = ">=9.0.3"
pytest-cov = ">=5.0.0"
# Capped below 0.16 to match the rest of the fleet.
ruff = ">=0.6,<0.16"
ty = ">=0.0.44"

# ---------------------------------------------------------------------------
# Maintainer tooling (Poetry group, not a PEP 621 extra)
# ---------------------------------------------------------------------------
# doc-kg and pycode-kg are tools this repo *runs*, not libraries it imports.
# Nothing under src/ imports either one. They live here rather than in `dev`
# so CI's lint and test jobs never install them.
#
#   poetry install --with kg      # get the dockg / pycodekg CLIs into .venv/bin
[tool.poetry.group.kg]
optional = true

[tool.poetry.group.kg.dependencies]
# Fleet floors: the releases that moved both packages onto the shared
# kgmodule-utils snapshot extension points.
doc-kg = ">=0.26.0"
pycode-kg = ">=0.27.0"

# ---------------------------------------------------------------------------
# Tool configuration
# ---------------------------------------------------------------------------
[tool.ruff]
line-length    = 100
target-version = "py312"
# Keep prose docs out of ruff 0.16's Markdown code-block formatting.
exclude = [".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B023", "BLE001", "PLC0415"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"
root = ["src"]

[tool.ty.rules]
# Be lenient about third-party stubs (mirrors mypy's ignore_missing_imports).
unresolved-import = "ignore"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --tb=short"

[tool.pycodekg]
# Tests skew architectural metrics (fan-in, public API surface, docstring coverage).
exclude = ["tests"]
include = ["src"]

[tool.dockg]
# fafb_v783/ and data/ hold connectome downloads, not documentation.
exclude = ["__pycache__", "dist", "src", "tests", "data", "fafb_v783"]
